<!DOCTYPE html>
<html lang="ms">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Sistem Baucar Buku</title>
  <!-- Kongsi CSS Utama + CSS Modul Khusus -->
  <link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,600;9..144,700&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="master.css">
  <link rel="stylesheet" href="baucar.css">
</head>
<body>
  
  <!-- Loader -->
  <div id="dynamicLoader"><div class="loader-track"><span></span></div></div>

  <header class="site-header">
    <div class="site-header-inner">
      <div class="brand">
        <a href="index.html" class="btn" style="padding:4px 12px; font-size:12px;">&larr; Kembali</a>
        <div style="margin-left:14px;">
          <div class="brand-name">SPBB Dashboard</div>
          <div class="brand-sub">Sistem Baucar Buku</div>
        </div>
      </div>
    </div>
  </header>

  <div class="shell">
    
    <!-- Admin View -->
    <div id="adminView" class="panel" style="display:none;">
      <h2>Panel Pentadbir</h2>
      <div class="table-scroll">
        <table class="responsive-table">
          <thead>
            <tr><th>Nama Sekolah</th><th>Jumlah Pelajar</th><th>Telah Ditebus (%)</th><th>Telah Diguna (%)</th></tr>
          </thead>
          <tbody id="adminSchoolBody"></tbody>
        </table>
      </div>
    </div>

    <!-- School Specific View -->
    <div id="schoolView" style="display:none;">
      <div class="panel hero-block">
        <h2 id="welcomeTitle" class="hero-title"></h2>
        
        <div class="metrics-grid">
          <div class="metric-card"><div class="metric-title">Jumlah Murid</div><div class="metric-value" id="valTotal">-</div></div>
          <div class="metric-card gold"><div class="metric-title">Sudah Tebus</div><div class="metric-value" id="valTebus">-</div></div>
          <div class="metric-card teal"><div class="metric-title">Sudah Guna</div><div class="metric-value" id="valGuna">-</div></div>
        </div>
      </div>

      <div class="panel">
        <div style="display:flex; gap:12px; margin-bottom:14px;">
          <input type="text" id="searchNama" class="form-control" placeholder="Cari nama murid..." oninput="applyFilters()">
          <select id="filterTingkatan" class="form-control" onchange="applyFilters()"><option value="">Semua Tingkatan</option></select>
        </div>
        
        <div class="table-scroll">
          <table class="responsive-table">
            <thead>
              <tr><th>#</th><th>Nama Murid</th><th>Tingkatan</th><th>Status Tebus</th><th>Status Guna</th></tr>
            </thead>
            <tbody id="tableBody"></tbody>
          </table>
        </div>
      </div>
    </div>

  </div>

  <!-- Bawa masuk master.js untuk fungsi fetchAPI base, kemudian baucarbuku.js -->
  <script src="master.js"></script>
  <script src="baucarbuku.js"></script>
</body>
</html>
