<!doctype html>
<html lang="ms">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Dashboard USTP PPD Meradong</title>
  <link rel="stylesheet" href="./css/style.css" />
</head>
<body>
  <header class="site-header">
    <div class="container">
      <h1>USTP PPD Meradong</h1>
      <p class="subtitle">Dashboard Utama — sambung ke modul berkaitan</p>
    </div>
  </header>

  <main class="container">
    <section class="buttons-grid">
      <button class="module-btn" data-module="pelajar">Modul Pelajar</button>
      <button class="module-btn" data-module="guru">Modul Guru</button>
      <button class="module-btn" data-module="pentadbiran">Modul Pentadbiran</button>
      <button class="module-btn" data-module="laporan">Modul Laporan</button>
    </section>

    <section id="module-area" class="module-area">
      <h2>Tiada modul dipilih</h2>
      <p>Pilih modul di atas untuk sambung (link modul akan ditambah kemudian).</p>
    </section>
  </main>

  <footer class="site-footer">
    <div class="container">&copy; USTP PPD Meradong</div>
  </footer>

  <script src="./js/app.js"></script>
</body>
</html>
