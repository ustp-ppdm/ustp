<!DOCTYPE html>
<html lang="ms">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>Master Portal | Dashboard Pendidikan</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,600;9..144,700&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="master.css">
</head>
<body>

  <!-- Reusable Loader -->
  <div id="dynamicLoader">
    <div class="loader-mark"></div>
    <div class="loader-track"><span></span></div>
    <div class="loading-text-container">
      <div class="loading-title">Sistem Dashboard</div>
      <div class="loading-subtitle" id="loaderMessage">Mengakses sistem...</div>
    </div>
  </div>

  <header class="site-header">
    <div class="site-header-inner">
      <div class="brand">
        <div class="brand-name">Master Portal</div>
        <div class="brand-sub">Dashboard Utama</div>
      </div>
      <div class="user-chip" id="userProfile" style="display:none;">
        <div class="user-info">
          <p class="user-name" id="userName"></p>
          <p class="user-email" id="userEmail"></p>
        </div>
      </div>
    </div>
  </header>

  <div class="shell">
    <div id="authView" class="panel hero-block">
      <h2 class="hero-title">Selamat Datang</h2>
      <p class="hero-sub">Sila sahkan identiti anda untuk mengakses modul.</p>
      <div class="input-group">
        <input type="password" id="pinInput" class="form-control" placeholder="Masukkan PIN Sekolah (Jika tiada akses e-mel)">
        <button class="btn btn-primary" onclick="verifyAccess()">Log Masuk</button>
      </div>
      <p id="authError" style="color:var(--rose); font-size:13px; margin-top:12px;"></p>
    </div>

    <!-- Modules Grid -->
    <div id="modulesView" style="display:none;">
      <h2 class="section-title">Modul Tersedia</h2>
      <div class="modules-grid">
        <!-- Module Card: Baucar Buku -->
        <a href="baucarbuku.html" class="module-card">
          <div class="module-icon">📚</div>
          <div class="module-content">
            <h3>Sistem Baucar Buku</h3>
            <p>Urus status penebusan dan penggunaan baucar buku pelajar.</p>
          </div>
        </a>
        
        <!-- Placeholder for Future Module -->
        <div class="module-card disabled">
          <div class="module-icon">⚙️</div>
          <div class="module-content">
            <h3>Modul Seterusnya</h3>
            <p>Akan datang...</p>
          </div>
        </div>
      </div>
    </div>
  </div>

  <script src="master.js"></script>
</body>
</html>
