<!doctype html>
<html lang="ms">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Dashboard USTP PPD Meradong</title>
  <link rel="stylesheet" href="./css/style.css" />
</head>
<body>
  <header class="topbar">
    <div class="topbar-inner">
      <div class="brand-wrap">
        <div class="brand-icon">📚</div>
        <div>
          <div class="brand-name">USTP PPD Meradong</div>
          <div class="brand-subtitle">Sistem Baucar Buku</div>
        </div>
      </div>
      <div class="topbar-actions">
        <span class="date-chip">2026</span>
        <button class="icon-button">☼</button>
      </div>
    </div>
  </header>

  <main class="app-layout">
    <aside class="sidebar">
      <div class="nav-header">
        <span class="nav-title">Modul</span>
        <span class="nav-badge">SPBB</span>
      </div>
      <nav class="nav-list">
        <button class="module-btn active" data-module="guru">
          <span class="nav-icon">👨‍🏫</span>
          <span>Guru</span>
        </button>
        <button class="module-btn" data-module="pelajar">
          <span class="nav-icon">🎓</span>
          <span>Pelajar</span>
        </button>
        <button class="module-btn" data-module="pentadbiran">
          <span class="nav-icon">⚙️</span>
          <span>Pentadbiran</span>
        </button>
        <button class="module-btn" data-module="laporan">
          <span class="nav-icon">📊</span>
          <span>Laporan</span>
        </button>
      </nav>

      <div class="quick-panel">
        <div class="quick-title">Status</div>
        <div class="online-row">
          <span class="live-dot"></span>
          <span>Pelayan aktif</span>
        </div>
      </div>
    </aside>

    <section class="content-panel">
      <section class="page-head">
        <div>
          <div class="page-kicker">Dashboard Utama</div>
          <h1 class="page-title">Modul Sistem</h1>
        </div>
        <div class="page-actions">
          <button class="btn btn-light">Semua Modul</button>
          <button class="btn btn-primary">Tambah Baru</button>
        </div>
      </section>

      <section class="stats-row">
        <article class="stat-card accent-gold">
          <span class="stat-label">Sekolah</span>
          <span class="stat-value">13</span>
          <span class="stat-subtitle">Aktif di sistem</span>
        </article>
        <article class="stat-card accent-green">
          <span class="stat-label">Pelajar</span>
          <span class="stat-value">1,842</span>
          <span class="stat-subtitle">Jumlah kesuluruhan</span>
        </article>
        <article class="stat-card accent-blue">
          <span class="stat-label">Tebusan</span>
          <span class="stat-value">68%</span>
          <span class="stat-subtitle">Daripada pelajar</span>
        </article>
      </section>

      <section id="module-area" class="module-area">
        <div class="module-empty">
          <div class="empty-icon">📘</div>
          <h2>Sistem Baucar Buku</h2>
          <p>Pilih modul di sebelah kiri untuk melihat panel operasi.</p>
        </div>
      </section>
    </section>
  </main>

  <script src="./js/app.js"></script>
</body>
</html>
